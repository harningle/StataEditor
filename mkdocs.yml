# Site into.
site_name: StataEditor
site_url: https://harningle.github.io/StataEditor/
site_author: Xuanyi WANG
site_description: >-
    Stata plugin for Sublime Text 3/4

# Repos.
repo_name: harningle/StataEditor
repo_url: https://github.com/harningle/StataEditor

# Config.
theme:
    name: material
    features:
        - content.code.copy
        - navigation.instant
        - toc.integrate

# Page structure
nav:
    - Overview: index.md
    - Getting started:
        - Installation: installation.md
        - Configuration: config.md
        - Using StataEditor: using.md
    - Contributing: contributing.md

# Extensions (copied from another proj., prob not all needed)
markdown_extensions:
    - toc:
        permalink: true
    - admonition
    - footnotes
    - tables
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true 
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.snippets
    - attr_list
    - abbr
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
